<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('tokoto-install-ready'));
      });

      (function() {
        try {
          var search = window.location.search;
          var isExplicitLanding = search.indexOf('landing=true') !== -1;
          var path = window.location.pathname;
          var segments = path.split('/').filter(Boolean);
          var tenant = segments[0];
          var reserved = ['login', 'register', 'superadmin', 'ota', 'assets', 'apk', 'landing'];
          if (tenant && reserved.indexOf(tenant) === -1) {
            localStorage.setItem('tokoto_last_tenant', tenant);
            localStorage.setItem('mmpos_last_tenant', tenant);
          } else if ((path === '/' || path === '') && !isExplicitLanding) {
            var saved = localStorage.getItem('tokoto_last_tenant') || localStorage.getItem('mmpos_last_tenant') || 'monikamulya';
            window.location.replace('/' + saved);
          }
        } catch(e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monika Mulya" />
    <meta name="theme-color" content="#18181b" />
    <link rel="manifest" id="dynamic-manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="/pwa-192x192.png" />
    <title>Tokoto POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
